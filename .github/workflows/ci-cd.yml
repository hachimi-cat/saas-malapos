name: CI/CD

# CI/CD moved to Depllo (.depllo-ci.yml) 2026-07-15 — push/PR triggers
# disabled; manual-dispatch fallback only.
on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate visual regression baselines on this branch and commit them back. Use after an intentional marketing chrome change.'
        type: boolean
        default: false

# Serialize per branch so stacked commits don't fire multiple parallel deploys
# against the staging/prod servers. cancel-in-progress=false because we want
# every push to still reach prod — just in order, not in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Workflow shell sanity
        # A comment between a \-continued env block and its command silently
        # unsets the env: the command runs bare and nothing errors. That shipped
        # here on 2026-07-14 and took an entire E2E suite down. Cheap to enforce.
        run: python3 scripts/check-workflow-continuations.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend type check
        run: cd backend && npm ci && npm run type-check
      - name: Frontend lint
        run: cd frontend && npm ci && npm run lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    # Independent of lint — they only share `checkout`. Running in parallel
    # cuts ~45s off the pipeline.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          # Lowercase snake placeholder — rename.sh rewrites `malapos`
          # to the product's snake id (uppercase placeholders here produced
          # an UPPERCASE db name after rename; template bug found spawning
          # suppuo).
          POSTGRES_DB: malapos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend tests
        run: |
          cd backend && npm ci
          DATABASE_URL=postgresql://postgres:test@localhost:5432/malapos_test \
            npx prisma migrate deploy
          DATABASE_URL=postgresql://postgres:test@localhost:5432/malapos_test \
            REDIS_URL=redis://localhost:6379 \
            JWT_SECRET=test-secret JWT_REFRESH_SECRET=test-refresh-secret \
            npm test
      - name: Frontend tests
        run: cd frontend && npm ci && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # The source of truth for build artifacts. Most NEXT_PUBLIC_* env vars
    # are identical across envs, BUT the Turnstile site key differs: it is
    # inlined at build time and must be ABSENT on staging (tailnet-locked,
    # captcha is friction), PRESENT on prod. Since NEXT_PUBLIC_* is baked in,
    # that means TWO frontend builds → frontend-out-staging (no site key) +
    # frontend-out-prod (with site key); each deploy downloads its own. The
    # backend dist is env-agnostic and shipped once.
    # The frontend is a DYNAMIC Next app (BFF session
    # portal, admin console proxy) — ship `.next/` and run `next start` on
    # the droplet, NOT a static export. NEXT_PUBLIC_API_URL is left as the
    # default `/api/v1` (relative) so the same build works on both staging
    # and prod — nginx proxies /api/v1 to the backend on both hosts.
    # Server-side env vars (HUUDIS_*, MIDTRANS_*, etc.) are read at runtime
    # from droplet .env and don't require a rebuild when they change.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build backend
        run: cd backend && npm ci && npx prisma generate && npm run build
      - name: Upload backend dist
        uses: actions/upload-artifact@v6
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
      - name: Clean frontend .next for prod rebuild
        run: rm -rf frontend/.next
      - name: Build frontend (production)
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Cloudflare Turnstile — inlined at build so @forjio/auth-ui renders
          # the widget on every (auth)/ + (admin)/ form. Empty => widget hidden.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: cd frontend && npm run build
      - name: Upload frontend (production)
        uses: actions/upload-artifact@v6
        with:
          name: frontend-out-prod
          include-hidden-files: true
          path: |
            frontend/.next/
            frontend/public/
            frontend/package.json
            frontend/package-lock.json
            frontend/next.config.*

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Gates on e2e-staging + visual-regression. Previous setting
    # decoupled e2e from prod ("E2E is advisory") was reverted
    # 2026-05-09 per bang's "all CI = huudis" directive.
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.repository != 'hachimi-cat/forjio-service-template'
    steps:
      # Reuses the Build job's artifacts — no re-checkout, no rebuild. Pulls
      # the PRODUCTION frontend build (frontend-out-prod), which inlines
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY so the captcha renders in prod. The
      # backend dist is the same artifact staging used (env-agnostic).
      - uses: actions/download-artifact@v7
        with:
          name: backend-dist
          path: backend/
      - uses: actions/download-artifact@v7
        with:
          name: frontend-out-prod
          path: frontend/
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude node_modules --exclude .git --exclude .env --exclude .npmrc --exclude frontend/.next/cache
          path: ./
          remote_path: /opt/saas/malapos/
          remote_host: ${{ secrets.PRODUCTION_HOST }}
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Migrate + restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/saas/malapos/backend
            sed -i '/^TURNSTILE_SECRET_KEY=/d' .env 2>/dev/null || true
            echo 'TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}' >> .env
            sed -i '/^TURNSTILE_ALLOWED_HOSTNAMES=/d' .env 2>/dev/null || true
            echo 'TURNSTILE_ALLOWED_HOSTNAMES=${{ secrets.TURNSTILE_ALLOWED_HOSTNAMES }}' >> .env
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart malapos || pm2 start dist/index.js --name malapos -i 1
            cd /opt/saas/malapos/frontend
            # Dynamic Next app — `.next/` pre-built in the artifact.
            npm ci --omit=dev
            pm2 restart malapos-frontend || pm2 start npm --name malapos-frontend -- start
            pm2 save

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.event.head_commit.message, 'v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract version
        id: ver
        run: |
          VER=$(echo "${{ github.event.head_commit.message }}" | grep -oP '^v\d+\.\d+\.\d+' || echo "")
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: steps.ver.outputs.version
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --target ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish CLI if changed
        if: steps.ver.outputs.version
        run: |
          if git diff --name-only HEAD~1 2>/dev/null | grep -q '^cli/'; then
            cd cli
            npm version patch --no-git-tag-version 2>/dev/null || true
            npm publish --access public 2>/dev/null || echo "CLI publish skipped"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
